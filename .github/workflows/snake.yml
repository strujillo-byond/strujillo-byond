name: Generate profile graphics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github
            dist/github-snake-dark.svg?palette=github-dark

      - name: Generate 3D contribution graphs
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Move 3D graphs into dist
        run: mv profile-3d-contrib dist/profile-3d-contrib

      - name: Check for metrics token
        id: metricstoken
        run: echo "has_token=${{ secrets.METRICS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Generate metrics card
        if: steps.metricstoken.outputs.has_token == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Mexico_City
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          output_action: none
          filename: metrics.svg

      - name: Move metrics card into dist
        if: steps.metricstoken.outputs.has_token == 'true'
        run: |
          mv metrics.svg dist/ 2>/dev/null \
            || mv /metrics_renders/metrics.svg dist/ 2>/dev/null \
            || { echo "metrics.svg not found in expected locations"; exit 1; }

      - name: Publish graphics to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
