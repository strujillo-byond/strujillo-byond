name: Generate profile graphics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # Self-generated stats card, so it never depends on the public Vercel instance.
  # Isolated job: the third-party action only gets a read-only token (SHA-pinned),
  # and hands the SVG to the publish job as an artifact.
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # show=contributions adds the all-time total (private ones included when
      # "Include private contributions" is on in profile settings).
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&bg_color=00000000&show=contributions
          path: stats.svg
          fail_on_error: true

      - name: Upload stats card
        uses: actions/upload-artifact@v7
        with:
          name: stats
          path: stats.svg

  generate:
    needs: stats
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github
            dist/github-snake-dark.svg?palette=github-dark

      - name: Download stats card
        uses: actions/download-artifact@v8
        with:
          name: stats
          path: dist

      - name: Check for metrics token
        id: metricstoken
        run: echo "has_token=${{ secrets.METRICS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Generate metrics card
        if: steps.metricstoken.outputs.has_token == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Mexico_City
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          output_action: none
          filename: metrics.svg

      - name: Move metrics card into dist
        if: steps.metricstoken.outputs.has_token == 'true'
        run: |
          mv metrics.svg dist/ 2>/dev/null \
            || mv /metrics_renders/metrics.svg dist/ 2>/dev/null \
            || { echo "metrics.svg not found in expected locations"; exit 1; }

      - name: Publish graphics to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
